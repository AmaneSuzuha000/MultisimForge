[project]
name = "MultisimForge"
version = "0.1.6"
description = "MultisimForge: generate, verify, simulate and screenshot NI Multisim 14 circuits from plain text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["multisim", "spice", "eda", "schematic", "simulation", "windows"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
capture = ["pywin32", "pillow", "numpy", "scipy"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/AmaneSuzuha000/MultisimForge"
Issues = "https://github.com/AmaneSuzuha000/MultisimForge/issues"
Changelog = "https://github.com/AmaneSuzuha000/MultisimForge/blob/main/CHANGELOG.md"

[project.scripts]
multisimforge = "multisimforge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["multisimforge"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# Only rules that catch real defects: undefined/unused names and syntax errors.
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]