[project]
name = "MultisimForge"
version = "0.1.1"
description = "MultisimForge: generate, verify, simulate and screenshot NI Multisim 14 circuits from plain text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["multisim", "spice", "eda", "schematic", "simulation", "windows"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
capture = ["pywin32", "pillow", "numpy", "scipy"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
multisimforge = "multisimforge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["multisimforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]