name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[dev]
      # Building a circuit needs a part library harvested from a licensed
      # Multisim installation, which a public runner does not have.
      # Those tests carry the needs_parts marker and skip here.
      - run: python -m pytest -q -m "not needs_parts"
      - run: python -m pytest -q -m needs_parts
        continue-on-error: true

  # Full suite, including circuit building, on a machine with Multisim.
  native:
    if: github.event_name == workflow_dispatch
    runs-on: [self-hosted, windows, multisim]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e .[dev,capture]
      - run: python -m pytest -q
